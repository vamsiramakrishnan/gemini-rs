[package]
name = "code-mode-eval"
version = "0.1.0"
edition = "2024"
publish = false
description = "Code execution against plain function calling on Gemini 3.8 Live"

# Outside the workspace: Monty needs a newer toolchain than the workspace's
# 1.93 floor (see rust-toolchain.toml and README.md).
[workspace]

[dependencies]
gemini-genai-rs = { path = "../../crates/gemini-genai-rs", features = ["live", "tls-native"] }
monty = "=1.1.0"
monty-types = "=1.1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
