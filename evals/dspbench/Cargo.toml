[package]
name = "dspbench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gemini-adk-fluent-rs = { path = "../../crates/gemini-adk-fluent-rs", features = ["dsp", "denoise"] }
gemini-adk-rs = { path = "../../crates/gemini-adk-rs" }
gemini-genai-rs = { path = "../../crates/gemini-genai-rs", features = ["vad"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
debug = false
