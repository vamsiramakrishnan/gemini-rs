[package]
name = "python-vs-rust"
version = "0.1.0"
edition = "2024"
publish = false
description = "The same Live voice agent in Python (google-genai) and Rust (gemini-rs), under load against a local stand-in"

# Outside the workspace: a load harness, not part of CI. Nothing here dials a
# real model; every run talks to a local stand-in.
[workspace]

[dependencies]
gemini-genai-rs = { path = "../../crates/gemini-genai-rs", features = ["live", "tls-native"] }
gemini-adk-rs = { path = "../../crates/gemini-adk-rs" }
gemini-adk-fluent-rs = { path = "../../crates/gemini-adk-fluent-rs" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
async-trait = "0.1"
serde_json = "1"
parking_lot = "0.12"
# The stand-in (trattoria_mock): one port for the Live WebSocket and REST.
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
base64 = "0.22"

[profile.release]
debug = false
