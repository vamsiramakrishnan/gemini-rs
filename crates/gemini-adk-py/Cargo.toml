[package]
name = "gemini-adk-py"
version = "0.8.0"
edition = "2021"
license = "MIT"
description = "Python bindings for the gemini-rs governed-conversation data plane"
publish = false

# Workspace-excluded (see root Cargo.toml [workspace].exclude): this crate links
# against libpython and is built by maturin, not `cargo build --workspace`.

[lib]
name = "_gemini_adk"
crate-type = ["cdylib"]

[dependencies]
gemini-adk-fluent-rs = { path = "../gemini-adk-fluent-rs" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
once_cell = "1"
