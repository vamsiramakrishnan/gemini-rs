[package]
name = "gemini-adk-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent runtime for Gemini Live — tools, streaming, agent transfer, middleware"
keywords = ["gemini", "agents", "adk", "tools", "streaming"]
categories = ["api-bindings", "asynchronous", "network-programming"]
repository.workspace = true
documentation = "https://docs.rs/gemini-adk-rs"
readme = "README.md"

[dependencies]
gemini-genai-rs = { workspace = true, features = ["vad"] }
gemini-adk-macros-rs = { workspace = true }
bytes = "1"
# Targeted features only; tests get `full` via dev-dependencies.
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util = "0.7"
async-trait = "0.1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dashmap = "6"
futures = "0.3"
parking_lot = "0.12"
regex = "1"
once_cell = "1"
strsim = "0.11"
uuid = { version = "1", features = ["v4"] }
tracing = { version = "0.1", optional = true }
metrics = { version = "0.24", optional = true }
# Persistence backends (optional, feature-gated)
sqlx = { version = "0.8", default-features = false, optional = true }
# REST-backed services: Vertex AI sessions/RAG memory + retrieval, MCP-over-HTTP.
# Optional: only compiled when an `http`-pulling feature is enabled.
reqwest = { version = "0.12", features = ["json", "multipart"], optional = true }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
proptest = "1"

[features]
default = []
gemini-llm = ["gemini-genai-rs/http", "gemini-genai-rs/generate"]
# Pulls the optional reqwest HTTP client; enabled transitively by the
# REST-backed feature areas below.
http = ["dep:reqwest"]
gcs-artifacts = ["http"]
tracing-support = ["dep:tracing", "gemini-genai-rs/tracing-support"]
# Passthroughs so applications don't need a direct gemini-genai-rs dependency.
vad-wavekat = ["gemini-genai-rs/vad-wavekat"]
tls-rustls = ["gemini-genai-rs/tls-rustls"]
metrics = ["dep:metrics"]
database-sessions = ["dep:sqlx", "sqlx/runtime-tokio-rustls", "sqlx/sqlite"]
postgres-sessions = ["database-sessions", "sqlx/postgres"]
vertex-ai-sessions = ["http"]
# Vertex AI managed code execution (Code Interpreter Extension over REST)
vertex-ai-code-executor = ["http"]
# Vertex AI RAG retrieval tool + memory service (over REST)
vertex-ai-rag = ["http"]
# MCP-over-HTTP/SSE transport (stdio transport needs no extra deps)
mcp-http = ["http"]
otel = ["gemini-genai-rs/otel", "tracing-support"]
otel-otlp = ["gemini-genai-rs/otel-otlp", "tracing-support"]
otel-gcp = ["gemini-genai-rs/otel-gcp", "tracing-support"]

[lints]
workspace = true
