[package]
name = "gemini-adk-macros-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural macros for gemini-adk-rs — the #[tool] attribute for turning async fns into Gemini tools"
keywords = ["gemini", "adk", "macros", "proc-macro", "tools"]
categories = ["api-bindings", "development-tools::procedural-macro-helpers"]
repository.workspace = true
documentation = "https://docs.rs/gemini-adk-macros-rs"

[lib]
name = "gemini_adk_macros_rs"
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"

# Integration tests exercise the generated code, which references the consumer's
# crate graph (gemini-adk-rs, serde, schemars, ...). These are dev-only and do
# NOT create a build cycle: the proc-macro crate itself depends on none of them.
#
# gemini-adk-rs is declared path-only (no version) ON PURPOSE: cargo strips
# versionless path dev-dependencies from the published package, which breaks
# the serde/serde_derive-style publish cycle — this crate must reach crates.io
# BEFORE gemini-adk-rs, whose matching version therefore cannot exist yet.
[dev-dependencies]
gemini-adk-rs = { path = "../gemini-adk-rs" }
async-trait = "0.1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Compile-fail UI tests for macro diagnostics (tests/ui.rs + tests/ui/**).
trybuild = "1"

[lints]
workspace = true
