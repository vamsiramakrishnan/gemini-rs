[package]
name = "gemini-genai-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wire protocol and transport for Gemini GenAI"
keywords = ["gemini", "genai", "multimodal", "audio", "realtime"]
categories = ["api-bindings", "multimedia::audio", "network-programming"]
repository.workspace = true
documentation = "https://docs.rs/gemini-genai-rs"
readme = "README.md"

[features]
# Slim by default: the live WebSocket protocol plus a TLS backend. Everything
# heavy (ML VAD model, tracing subscriber, REST surfaces) is opt-in — for an
# SDK, default compile weight is API surface.
default = ["live", "tls-native"]
live = []
vad = []
vad-wavekat = ["vad", "dep:wavekat-vad"]
# TLS backend for the WebSocket (and optional REST) transport. Enable exactly
# one. With neither, the crate compiles but cannot dial `wss://`/`https://`.
tls-native = ["tokio-tungstenite/native-tls", "reqwest?/native-tls"]
tls-rustls = ["tokio-tungstenite/rustls-tls-native-roots", "reqwest?/rustls-tls"]
http = ["dep:reqwest"]
generate = ["http"]
embed = ["http"]
files = ["http"]
models = ["http"]
tokens = ["http"]
caches = ["http"]
tunings = ["http"]
batches = ["http"]
chats = ["generate"]
all-apis = ["generate", "embed", "files", "models", "tokens", "caches", "tunings", "batches", "chats"]
# The `tracing` facade is an unconditional (tiny) dependency; spans/events are
# no-ops unless a subscriber is installed. `tracing-subscriber` pulls the
# fmt/EnvFilter subscriber machinery behind `TelemetryConfig::init`.
# DEPRECATED(0.8): `tracing-support` is a no-op kept one release for manifest
# compatibility — the facade and telemetry helpers are always compiled.
tracing-support = []
tracing-subscriber = ["dep:tracing-subscriber"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
# OpenTelemetry feature hierarchy:
#   otel-base  — shared deps (opentelemetry, opentelemetry_sdk, tracing-opentelemetry)
#   otel-otlp  — generic OTLP exporter (grpc-tonic via opentelemetry-otlp)
#   otel-gcp   — Google Cloud-native exporters (Cloud Trace + Cloud Monitoring, ADC auth)
#   otel       — backwards-compatible alias for otel-otlp
otel-base = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:tracing-opentelemetry",
  "tracing-subscriber",
]
otel-otlp = ["otel-base", "dep:opentelemetry-otlp"]
otel-gcp = ["otel-base", "dep:opentelemetry-gcloud-trace", "dep:opentelemetry_gcloud_monitoring_exporter"]
otel = ["otel-otlp"]

[dependencies]
# Async runtime — targeted features only; tests get `full` via dev-dependencies.
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
# TLS backend is selected via the `tls-native`/`tls-rustls` crate features.
tokio-tungstenite = { version = "0.24" }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Async trait
async-trait = "0.1"

# Error handling
thiserror = "2"

# Identifiers
uuid = { version = "1", features = ["v4"] }

# Byte manipulation
bytes = "1"
bytemuck = { version = "1", features = ["derive"] }

# Concurrency
parking_lot = "0.12"
dashmap = "6"

# URL parsing

# HTTP client (optional, for REST APIs). TLS comes from `tls-native`/`tls-rustls`.
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }

# Audio (optional)
wavekat-vad = { version = "0.1.14", optional = true, default-features = true }

# Tracing facade — unconditional: the transport emits spans/events; cost is
# negligible without a subscriber installed.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

# Metrics (optional)
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true }

# OpenTelemetry — shared (otel-base)
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "metrics"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

# OpenTelemetry — generic OTLP exporter (otel-otlp)
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace", "metrics"], optional = true }

# OpenTelemetry — Google Cloud-native exporters (otel-gcp)
opentelemetry-gcloud-trace = { version = "0.22", optional = true }
opentelemetry_gcloud_monitoring_exporter = { version = "0.22", features = ["tokio"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"

[[bench]]
name = "audio_pipeline"
harness = false

[lints]
workspace = true
