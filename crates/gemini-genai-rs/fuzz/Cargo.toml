[package]
name = "gemini-genai-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Its own workspace: cargo-fuzz builds this crate with a nightly toolchain and
# sanitizer flags, which must not leak into the main workspace's lockfile or
# feature resolution.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
# libFuzzer entry point for each target.
libfuzzer-sys = "0.4"
# Structured inputs: the second target draws a syntactically valid server
# frame from the fuzzer's bytes so coverage reaches the parser's branches
# instead of stopping at JSON syntax errors.
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# The WebSocket message type the transport classifies (`frame_payload`).
tokio-tungstenite = "0.30"

[dependencies.gemini-genai-rs]
path = ".."
default-features = false
features = ["live"]

[[bin]]
name = "decode_server_message"
path = "fuzz_targets/decode_server_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_frame_structured"
path = "fuzz_targets/server_frame_structured.rs"
test = false
doc = false
bench = false
