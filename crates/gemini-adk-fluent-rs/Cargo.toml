[package]
# Integration tests are one binary (tests/main.rs); see that file.
autotests = false
name = "gemini-adk-fluent-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fluent DX for Gemini Live — builder API, operator algebra, composition modules"
keywords = ["gemini", "agents", "fluent", "builder", "composition"]
categories = ["api-bindings", "asynchronous", "development-tools"]
repository.workspace = true
documentation = "https://docs.rs/gemini-adk-fluent-rs"
readme = "README.md"

# docs.rs builds with default features unless told otherwise, which hides
# every feature-gated module and prints no "available on crate feature X only"
# badge for what it does show. `docsrs` turns those badges on.
# Every feature except `voice-io` and the `voice`/`full` bundles that include
# it: `voice-io` pulls `cpal`, whose ALSA backend needs libasound headers at
# build time and the docs.rs builder has none. `talk()` therefore has no
# docs.rs page; the book covers it instead.
[package.metadata.docs.rs]
features = ["templates", "default", "gemini-llm", "http-tools", "gcs-store", "denoise", "dsp", "sip", "tracing-support", "vad-wavekat", "tls-native", "tls-rustls", "otel", "otel-otlp", "otel-gcp", "ai-gateway", "code-mode", "code-pool"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
gemini-genai-rs = { workspace = true, default-features = false, features = ["live"] }
gemini-adk-rs  = { workspace = true, default-features = false }
base64 = "0.22"
bytes = "1"
# Targeted features only; tests get `full` via dev-dependencies.
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs"] }
async-trait = "0.1"
# `StreamExt`, re-exported by the prelude for consuming `agent.stream(..)`.
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
# MCP and HTTP tool endpoints are validated as URLs before a session starts.
url = "2"
# Bundle version ids (`spec::store`).
sha2 = "0.11"
parking_lot = "0.12"
tracing = "0.1"
# Optional: HTTP tool bindings for spec-driven sessions (`http-tools`).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
], optional = true }
# Optional: native microphone/speaker duplex for `voice::Talk` (`voice-io`).
cpal = { version = "0.18", optional = true }
# Optional DSP chain (`denoise`, `dsp`): RNNoise-style denoiser, the FFT the
# echo canceller and STFT stages run on, and the sinc resampler between the
# device rate and the Live API's 16/24 kHz.
nnnoiseless = { version = "0.5", default-features = false, optional = true }
realfft = { version = "3", optional = true }
rubato = { version = "5.0", optional = true }
# Optional: in-process SIP signalling for `telephony::sip` (`sip`).
rsipstack = { version = "0.7", optional = true }
# SRTP (RFC 3711) for `telephony::srtp` (`sip`): AES-CM-128 + HMAC-SHA1.
aes = { version = "0.9", optional = true }
hmac = { version = "0.13", optional = true }
sha1 = { version = "0.11", optional = true }
# `std`: SRTP turns a getrandom error into an io::Error.
getrandom = { version = "0.4", features = ["std"], optional = true }
# Both only behind `voice-io`: the cancellation token the pump shares with the
# device streams, and `VoiceIoError`.
tokio-util = { version = "0.7", optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
# The live eval harness calls Jev through AI Gateway.
gemini-adk-rs = { workspace = true, features = ["ai-gateway"] }
# Property tests over `SessionSpec` documents (tests/spec_round_trip_props.rs).
proptest = "1"
# The spec property tests parse the generated `main.rs` and read its flow
# back, so a generator change that drops a step or guard fails there.
syn = { version = "2", features = ["full"] }
# ... and the generated `Cargo.toml`.
toml = "0.9"
# The end-to-end fast-lane benchmark (benches/fast_lane.rs).
criterion = { version = "0.5", default-features = false }
base64 = "0.22"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
# `debt_collection_eval` synthesises the caller's side with Gemini TTS and
# drives it into a real Live session as PCM, because a governed flow that holds
# under typed input and not under speech is a flow that does not hold.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
] }
parking_lot = "0.12"

[features]
# Bundles. `voice` is everything a microphone/speaker application wants;
# `full` is every optional capability with the default TLS backend. Neither
# is on by default: `voice-io` needs system audio headers and `full` pulls
# the SIP stack and an OpenTelemetry exporter, which most text agents never
# use. Both keep `tls-native`; pick `tls-rustls` with `--no-default-features`
# and name the pieces instead.
voice = ["voice-io", "denoise", "dsp", "vad-wavekat"]
full = ["voice", "sip", "http-tools", "gcs-store", "templates", "gemini-llm", "tls-rustls", "otel-otlp", "ai-gateway", "code-mode"]
templates = ["gemini-adk-rs/templates"]
# One TLS backend and text generation are on by default: `AgentBuilder::build`
# runs on `GeminiLlm`, which is pure Rust, so a plain `cargo add` answers a
# question. Swap the TLS backend with `--no-default-features --features
# tls-rustls,gemini-llm`.
default = ["tls-rustls", "gemini-llm", "code-mode"]
# Also the HTTP client that fetches Vertex tokens from the metadata server.
gemini-llm = ["gemini-adk-rs/gemini-llm", "gemini-genai-rs/http"]
# HTTP tool bindings in `spec` (SessionSpec `tools[].http`).
http-tools = ["dep:reqwest"]
# Decision models (TypeSafe AI's Jev) through Vercel AI Gateway:
# `gemini_adk_rs::decision::GatewayDecisionModel`.
ai-gateway = ["gemini-adk-rs/ai-gateway"]
# Cloud Storage backend for `spec::store` (`gs://` bundle stores).
gcs-store = ["dep:reqwest", "gemini-genai-rs/http"]
# Native microphone/speaker duplex (`voice::Talk::talk`). Needs system audio
# headers (Linux: libasound2-dev).
voice-io = ["dep:cpal", "dep:thiserror", "tokio/signal"]
# RNNoise speech enhancement as a mic-chain stage (`voice::Denoiser`).
# Pure Rust, no system dependencies.
denoise = ["dep:nnnoiseless"]
dsp = ["dep:realfft", "dep:rubato"]
# In-process SIP agent (`telephony::sip::SipAgent`) — answer raw SIP calls
# (rsipstack signalling + built-in RTP/SDP/G.711 media).
sip = ["dep:rsipstack", "dep:tokio-util", "dep:aes", "dep:hmac", "dep:sha1", "dep:getrandom", "tokio/net", "tokio/rt-multi-thread"]
# No-op passthrough (tracing is always compiled); kept for manifest compatibility.
tracing-support = ["gemini-adk-rs/tracing-support"]
# Code mode: the model's programs run in Monty in this process (`code-mode`)
# or in Monty worker processes (`code-pool`, needs the `monty` binary).
code-mode = ["gemini-adk-rs/code-mode"]
code-pool = ["gemini-adk-rs/code-pool"]
# Passthroughs so applications don't need lower-layer dependencies.
vad-wavekat = ["gemini-adk-rs/vad-wavekat"]
tls-native = ["gemini-adk-rs/tls-native", "gemini-genai-rs/tls-native"]
tls-rustls = ["gemini-adk-rs/tls-rustls", "gemini-genai-rs/tls-rustls"]
otel = ["gemini-adk-rs/otel", "gemini-genai-rs/otel"]
otel-otlp = ["gemini-adk-rs/otel-otlp", "gemini-genai-rs/otel-otlp"]
otel-gcp = ["gemini-adk-rs/otel-gcp", "gemini-genai-rs/otel-gcp"]

[lints]
workspace = true

[[bench]]
name = "fast_lane"
harness = false

[[test]]
name = "main"
path = "tests/main.rs"

# Kept as its own process: it sets environment variables or global state.
[[test]]
name = "spec_live_eval"
path = "tests/spec_live_eval.rs"

# Kept as its own process: it records this process's tracing spans through a
# thread-local subscriber, and a neighbouring session's spans would be noise.
[[test]]
name = "live_session_trace"
path = "tests/live_session_trace.rs"
