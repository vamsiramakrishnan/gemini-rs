[package]
name = "gemini-adk-fluent-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fluent DX for Gemini Live — builder API, operator algebra, composition modules"
keywords = ["gemini", "agents", "fluent", "builder", "composition"]
categories = ["api-bindings", "asynchronous", "development-tools"]
repository.workspace = true
documentation = "https://docs.rs/gemini-adk-fluent-rs"
readme = "README.md"

[dependencies]
gemini-genai-rs = { workspace = true }
gemini-adk-rs  = { workspace = true }
base64 = "0.22"
bytes = "1"
# Targeted features only; tests get `full` via dev-dependencies.
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
parking_lot = "0.12"
tracing = "0.1"
# Optional: HTTP tool bindings for spec-driven sessions (`http-tools`).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
], optional = true }
# Optional: native microphone/speaker duplex for `voice::Talk` (`voice-io`).
cpal = { version = "0.15", optional = true }
nnnoiseless = { version = "0.5", default-features = false, optional = true }
# Optional: in-process SIP signalling for `telephony::sip` (`sip`).
rsipstack = { version = "0.6", optional = true }
tokio-util = { version = "0.7", optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
# `debt_collection_eval` synthesises the caller's side with Gemini TTS and
# drives it into a real Live session as PCM, because a governed flow that holds
# under typed input and not under speech is a flow that does not hold.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
] }
parking_lot = "0.12"

[features]
templates = ["gemini-adk-rs/templates"]
default = []
gemini-llm = ["gemini-adk-rs/gemini-llm"]
# HTTP tool bindings in `spec` (SessionSpec `tools[].http`).
http-tools = ["dep:reqwest"]
# Native microphone/speaker duplex (`voice::Talk::talk`). Needs system audio
# headers (Linux: libasound2-dev).
voice-io = ["dep:cpal", "dep:thiserror", "tokio/signal"]
# RNNoise speech enhancement as a mic-chain stage (`voice::Denoiser`).
# Pure Rust, no system dependencies.
denoise = ["dep:nnnoiseless"]
# In-process SIP agent (`telephony::sip::SipAgent`) — answer raw SIP calls
# (rsipstack signalling + built-in RTP/SDP/G.711 media).
sip = ["dep:rsipstack", "dep:tokio-util", "tokio/net", "tokio/rt-multi-thread"]
tracing-support = ["gemini-adk-rs/tracing-support"]
# Passthroughs so applications don't need lower-layer dependencies.
vad-wavekat = ["gemini-adk-rs/vad-wavekat"]
tls-rustls = ["gemini-adk-rs/tls-rustls", "gemini-genai-rs/tls-rustls"]
otel = ["gemini-adk-rs/otel", "gemini-genai-rs/otel"]
otel-otlp = ["gemini-adk-rs/otel-otlp", "gemini-genai-rs/otel-otlp"]
otel-gcp = ["gemini-adk-rs/otel-gcp", "gemini-genai-rs/otel-gcp"]

[lints]
workspace = true
