# Scale on CPU, which tracks audio processing per session. Scaling down
# evicts pods, which drain first (terminationGracePeriodSeconds).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adk-runtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adk-runtime
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
