# The Kubernetes service account adk-runtime runs as, mapped to a Google
# service account with Workload Identity. Grant the Google account
# roles/aiplatform.user and roles/storage.objectViewer on the bucket, and
# let this account act as it:
#
#   gcloud iam service-accounts add-iam-policy-binding \
#     adk-runtime@PROJECT_ID.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:PROJECT_ID.svc.id.goog[default/adk-runtime]"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adk-runtime
  annotations:
    iam.gke.io/gcp-service-account: adk-runtime@PROJECT_ID.iam.gserviceaccount.com
