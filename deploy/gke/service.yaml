# The Service behind the Ingress, and the load balancer settings a
# WebSocket needs: the default backend timeout (30 s) would cut every
# session, so allow the longest session instead.
apiVersion: v1
kind: Service
metadata:
  name: adk-runtime
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "adk-runtime"}'
spec:
  type: ClusterIP
  selector:
    app: adk-runtime
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: adk-runtime
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /readyz
    port: 8080
