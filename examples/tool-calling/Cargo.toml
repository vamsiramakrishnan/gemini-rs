[package]
name = "example-tool-calling"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
gemini-adk-fluent-rs = { workspace = true }
# `#[tool]` expands to `::gemini_adk_rs::…` paths, so the L1 crate must be a
# direct dependency of any crate that uses the macro.
gemini-adk-rs = { workspace = true }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
dotenvy = "0.15"
base64 = "0.22"

[lints]
workspace = true
