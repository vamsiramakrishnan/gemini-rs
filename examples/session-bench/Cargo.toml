[package]
name = "example-session-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Concurrent Live-session capacity harness: N sessions, no model, no network"

# The harness attaches the real L1 control plane to a scripted L0 transport,
# so it needs the runtime and wire crates directly. No TLS backend: nothing
# is dialed.
[dependencies]
gemini-adk-rs = { workspace = true }
gemini-genai-rs = { workspace = true, features = ["live"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
parking_lot = "0.12"

[[bin]]
name = "session-bench"
path = "src/main.rs"

[lints]
workspace = true
