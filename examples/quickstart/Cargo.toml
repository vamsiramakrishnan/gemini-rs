[package]
name = "example-quickstart"
version.workspace = true
edition.workspace = true
publish = false

# The two programs the README's Quickstart prints, compiled in CI exactly as
# printed there — `tests/readme_snippets.rs` fails the build if the README
# and these files ever drift apart.
#
# `voice-io` (cpal → alsa-sys) is deliberately NOT a default: the text program
# is advertised as needing no audio dependencies, and a default feature would
# make that false — `cargo run --bin hello-text`, and every plain workspace
# build, would demand ALSA headers on Linux. `hello-voice` opts in instead.

[dependencies]
gemini-adk-fluent-rs = { path = "../../crates/gemini-adk-fluent-rs", features = [
    "gemini-llm",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# Enables the microphone/speaker duplex used by `hello-voice`.
voice = ["gemini-adk-fluent-rs/voice-io"]

[[bin]]
name = "hello-text"
path = "src/bin/hello_text.rs"

[[bin]]
name = "hello-voice"
path = "src/bin/hello_voice.rs"
required-features = ["voice"]

[lints]
workspace = true
