[package]
name = "example-quickstart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# The programs the README's Quickstart prints, compiled in CI exactly as
# printed there — `tests/readme_snippets.rs` fails the build if the README
# and these files ever drift apart.
#
# `gemini-llm` (the text program's engine) is a default feature of the fluent
# crate, so the base dependency names no features. `voice-io` (cpal → alsa-sys)
# is deliberately NOT enabled here: the text program is advertised as needing
# no audio dependencies, and enabling it would make that false — `cargo run
# --bin hello-text`, and every plain workspace build, would demand ALSA headers
# on Linux. `hello-voice` opts in through the `voice` feature instead.

[dependencies]
gemini-adk-fluent-rs = { path = "../../crates/gemini-adk-fluent-rs" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Typed answers and tool arguments derive these.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

[features]
# Enables the microphone/speaker duplex used by `hello-voice`.
voice = ["gemini-adk-fluent-rs/voice-io"]

[[bin]]
name = "hello-text"
path = "src/bin/hello_text.rs"

[[bin]]
name = "chat"
path = "src/bin/chat.rs"

[[bin]]
name = "typed"
path = "src/bin/typed.rs"

[[bin]]
name = "tool"
path = "src/bin/tool.rs"

[[bin]]
name = "hello-voice"
path = "src/bin/hello_voice.rs"
required-features = ["voice"]

[lints]
workspace = true
