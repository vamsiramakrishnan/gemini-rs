<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="arrowd" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#475569"/></marker><marker id="arrowr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#dc2626"/></marker><marker id="arrowg" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#16a34a"/></marker><marker id="arrowv" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#7c3aed"/></marker></defs><rect x="1" y="1" width="758" height="608" rx="16" fill="#ffffff" stroke="#e6eaf0" stroke-width="1.5"/><rect x="180.0" y="22" width="400" height="30" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="380.0" y="37.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#92400e" text-anchor="middle" font-weight="400" dominant-baseline="central">User speaks: "I'm Alice from Acme Corp"</text><line x1="60.0" y1="58.0" x2="60.0" y2="546.0" stroke="#94a3b8" stroke-width="2"/><circle cx="60" cy="80" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="60.0" y="80.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#166534" text-anchor="middle" font-weight="700" dominant-baseline="central">1</text><text x="92.0" y="72.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="500" dominant-baseline="central">Fast lane: on_audio, on_input_transcript</text><text x="92.0" y="92.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="central">→ (sync, &lt;1 ms)</text><circle cx="60" cy="138" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="60.0" y="138.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#166534" text-anchor="middle" font-weight="700" dominant-baseline="central">2</text><text x="92.0" y="138.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="500" dominant-baseline="central">Model responds, turn completes</text><circle cx="60" cy="196" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="60.0" y="196.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700" dominant-baseline="central">3</text><text x="92.0" y="196.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="500" dominant-baseline="central">Control lane: TranscriptBuffer records the turn</text><circle cx="60" cy="254" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="60.0" y="254.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700" dominant-baseline="central">4</text><text x="92.0" y="246.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="500" dominant-baseline="central">Extractors run (OOB LLM call)</text><text x="92.0" y="266.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="central">→ writes caller_name="Alice", caller_org="Acme Corp"</text><circle cx="60" cy="312" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="60.0" y="312.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700" dominant-baseline="central">5</text><text x="92.0" y="304.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="500" dominant-baseline="central">Watchers fire on state changes</text><text x="92.0" y="324.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="central">→ crossed_above, became_true, changed_to</text><circle cx="60" cy="370" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="60.0" y="370.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700" dominant-baseline="central">6</text><text x="92.0" y="362.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="500" dominant-baseline="central">Computed variables recompute</text><text x="92.0" y="382.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="central">→ derived:risk_level updates</text><circle cx="60" cy="428" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="60.0" y="428.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700" dominant-baseline="central">7</text><text x="92.0" y="420.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="500" dominant-baseline="central">Phase machine evaluates transitions</text><text x="92.0" y="440.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="central">→ identify_caller → handle_request</text><circle cx="60" cy="486" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="60.0" y="486.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700" dominant-baseline="central">8</text><text x="92.0" y="478.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="500" dominant-baseline="central">Phase on_exit / on_enter hooks fire</text><text x="92.0" y="498.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="central">→ instruction + navigation context updated</text><circle cx="60" cy="544" r="15" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.8"/><text x="60.0" y="544.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700" dominant-baseline="central">9</text><text x="92.0" y="536.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="500" dominant-baseline="central">Telemetry lane: Signals + Telemetry update</text><text x="92.0" y="556.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="central">→ turn_count++, latency + tokens recorded</text></svg>
