ont-size="13" fill="#1e40af" text-anchor="middle" font-weight="400" dominant-baseline="central">Model: "How can I help?"</text><rect x="430" y="80" width="320" height="130" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="448.0" y="110.9" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#92400e" text-anchor="start" font-weight="400" dominant-baseline="central">instruction → Phase B</text><text x="448.0" y="128.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#92400e" text-anchor="start" font-weight="400" dominant-baseline="central">enter_prompt injected as</text><text x="448.0" y="145.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#92400e" text-anchor="start" font-weight="400" dominant-baseline="central">Content::model():</text><text x="448.0" y="162.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#92400e" text-anchor="start" font-weight="400" dominant-baseline="central">  "I have the name. I'll verify."</text><text x="448.0" y="179.1" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#92400e" text-anchor="start" font-weight="400" dominant-baseline="central">turnComplete: true</text><line x1="360.0" y1="140.0" x2="428.0" y2="140.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrowd)"/><line x1="590.0" y1="210.0" x2="590.0" y2="250.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrowd)"/><rect x="430" y="250" width="320" height="80" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="590.0" y="281.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" dominant-baseline="central">Model sees its "own" previous output</text><text x="590.0" y="