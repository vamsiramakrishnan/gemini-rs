<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="arrowd" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#475569"/></marker><marker id="arrowr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#dc2626"/></marker><marker id="arrowg" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#16a34a"/></marker><marker id="arrowv" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#7c3aed"/></marker></defs><rect x="1" y="1" width="818" height="558" rx="16" fill="#ffffff" stroke="#e6eaf0" stroke-width="1.5"/><text x="140.0" y="40.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700" dominant-baseline="central">Gemini API</text><rect x="50" y="60" width="200" height="120" rx="11" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/><text x="150.0" y="92.3" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#475569" text-anchor="middle" font-weight="400" dominant-baseline="central">Model speaks…</text><text x="150.0" y="110.8" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#475569" text-anchor="middle" font-weight="400" dominant-baseline="central">Model finishes</text><text x="150.0" y="129.2" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#475569" text-anchor="middle" font-weight="400" dominant-baseline="central"></text><text x="150.0" y="147.7" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#475569" text-anchor="middle" font-weight="400" dominant-baseline="central">emits TurnComplete</text><text x="560.0" y="40.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700" dominant-baseline="central">Control Lane pipeline</text><rect x="330" y="60" width="460" height="470" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="352.0" y="84.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">1.  Reset turn state</text><text x="352.0" y="107.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">2.  Finalize transcript</text><text x="352.0" y="131.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">3.  Snapshot watched keys (before)</text><text x="352.0" y="154.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#92400e" text-anchor="start" font-weight="700" dominant-baseline="central">4.  Run extractors (filtered by trigger)</text><text x="352.0" y="178.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">5.  Recompute derived state</text><text x="352.0" y="201.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">6.  Build transcript window</text><text x="352.0" y="225.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#92400e" text-anchor="start" font-weight="700" dominant-baseline="central">7.  Evaluate phase transitions</text><text x="352.0" y="248.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">7b. Regenerate navigation context</text><text x="352.0" y="272.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">7c. Run OnPhaseChange extractors</text><text x="352.0" y="295.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">8.  Fire watchers (before vs after)</text><text x="352.0" y="319.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">9.  Check temporal patterns</text><text x="352.0" y="342.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">10. Instruction amendment</text><text x="352.0" y="366.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">11. Instruction template</text><text x="352.0" y="389.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">12. Send instruction update (deduped)</text><text x="352.0" y="413.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">13. Send on_enter context</text><text x="352.0" y="436.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">14. turnComplete if prompt_on_enter</text><text x="352.0" y="460.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">15. Turn boundary hook</text><text x="352.0" y="483.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="400" dominant-baseline="central">16. User turn-complete callback</text><text x="352.0" y="507.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#92400e" text-anchor="start" font-weight="700" dominant-baseline="central">17. Increment turn_count</text><line x1="250.0" y1="120.0" x2="328.0" y2="120.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrowd)"/><text x="289.0" y="110.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">TurnComplete</text></svg>
