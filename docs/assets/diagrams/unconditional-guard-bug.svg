<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="arrowd" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#475569"/></marker><marker id="arrowr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#dc2626"/></marker><marker id="arrowg" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#16a34a"/></marker><marker id="arrowv" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="#7c3aed"/></marker></defs><rect x="1" y="1" width="758" height="418" rx="16" fill="#ffffff" stroke="#e6eaf0" stroke-width="1.5"/><rect x="270.0" y="26" width="220" height="40" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/><text x="380.0" y="46.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#334155" text-anchor="middle" font-weight="400" dominant-baseline="central">Session connects</text><rect x="180.0" y="110" width="400" height="110" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="380.0" y="138.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700" dominant-baseline="central">greeting phase enters</text><text x="380.0" y="155.2" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="400" dominant-baseline="central">prompt_on_enter fires</text><text x="380.0" y="172.9" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="400" dominant-baseline="central">Model: "Hello!"</text><text x="380.0" y="190.7" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="400" dominant-baseline="central">TurnComplete  →  Guard: true  →  transition fires</text><line x1="380.0" y1="66.0" x2="380.0" y2="108.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrowd)"/><rect x="266.6" y="235.0" width="226.7" height="18" rx="7" fill="#ffffff"/><text x="380.0" y="244.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">…but the user hasn't spoken yet</text><rect x="160.0" y="268" width="440" height="110" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="380.0" y="305.2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#991b1b" text-anchor="middle" font-weight="700" dominant-baseline="central">next_phase enters</text><text x="380.0" y="322.1" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="400" dominant-baseline="central">enter_prompt: "User said…"   ← nothing was said</text><text x="380.0" y="339.8" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="400" dominant-baseline="central">Model HALLUCINATES a response</text><line x1="380.0" y1="220.0" x2="380.0" y2="266.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrowr)"/></svg>
