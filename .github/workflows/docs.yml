name: Documentation

# Builds apps/docs (Astro + Starlight, content synced from docs/) plus the
# rustdoc API reference, and deploys the two together to GitHub Pages. Pull
# requests run the exact production build but never upload or deploy.
#
# Not path-filtered on purpose: the rustdoc half depends on every crate, so a
# code-only push still has to rebuild and redeploy the site.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Node 20 is removed from runners 2026-09; fail loud now, not on the flag day.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ASTRO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # ── Link check on the SOURCE markdown (offline, no network calls) ───────
      # The api/gemini_*_rs/ links resolve only in the deployed site (rustdoc
      # is merged into dist/api below), so exclude them here; the rendered
      # tree gets its own check inside `npm run build` (check-content.mjs).
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --exclude 'api/gemini_[a-z_]+_rs/'
            docs/src docs/user-guide README.md
          fail: true

      # ── The website ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install site dependencies
        run: npm ci
        working-directory: apps/docs
      # sync docs/ → content tree, validate every internal link, astro build.
      - name: Build site
        run: npm run build
        working-directory: apps/docs

      # ── The rustdoc API reference ───────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      # `--all-features`: the deployed reference is the one place a
      # feature-gated module (`vad`, `otel`, `vertex-ai-sessions`, `dsp`,
      # `sip`, …) is documented in full, since docs.rs cannot build the
      # `voice-io` feature at all. ALSA is what `voice-io` needs.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build rustdoc (no warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --all-features --locked

      - name: Merge rustdoc into the site
        run: |
          cp -r target/doc apps/docs/dist/api
          printf '<meta http-equiv="refresh" content="0; url=gemini_adk_fluent_rs/index.html">' \
            > apps/docs/dist/api/index.html

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
