name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Node 20 is removed from runners 2026-09; fail loud now, not on the flag day.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2

      # ── mdBook + plugins ────────────────────────────────────────────────────
      # Installed from the release tarball directly: no Node action involved
      # (peaceiris/actions-mdbook is Node 20-only) and faster than the action.
      - name: Install mdBook
        run: |
          MDBOOK_VERSION="v0.4.40"
          curl -sfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          mdbook --version

      - name: Install mdBook plugins
        run: |
          cargo install mdbook-pagetoc --locked --version "^0.2"

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build mdBook user guide
        run: mdbook build docs

      # ── Link check (internal/relative links only — no flaky network calls) ──
      # The api/gemini_* links resolve only in the deployed site (rustdoc is
      # merged into target/book/api at deploy time below), so exclude them
      # from the source-tree offline check.
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --exclude 'api/gemini_(genai|adk|adk_fluent)_rs'
            docs/src README.md
          fail: true

      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check rustdoc (no warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --locked

      # ── Upload artifact (main branch only) ──────────────────────────────────
      - name: Build rustdoc API reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo doc --no-deps --workspace --locked

      - name: Merge rustdoc into mdBook output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp -r target/doc target/book/api
          printf '<meta http-equiv="refresh" content="0; url=api/gemini_genai_rs/index.html">' \
            > target/book/api/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: target/book

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
