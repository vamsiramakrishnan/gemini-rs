name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here only reads the repository: it checks out, builds and tests.
# None writes a comment, a check run, a release or a package, so the whole
# workflow drops to the one scope it needs and any future job that wants more
# has to say so at the job level. Left implicit, GITHUB_TOKEN carries whatever
# the repository default grants — write, in a default-permissive repo — to
# eight jobs that compile third-party build scripts and proc-macros from
# crates.io. (CodeQL `actions/missing-workflow-permissions`, 8 alerts.)
permissions:
  contents: read

# A push to a PR branch supersedes the previous head's run: cancel it instead
# of queueing 30 more jobs behind it. Pushes to main keep every run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node 20 is removed from runners 2026-09; fail loud now, not on the flag day.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Every cargo invocation below passes `--locked`. Without it cargo is free to
# re-resolve and rewrite Cargo.lock in the runner, so CI green means "some
# resolution builds" rather than "the committed one does" — and the lockfile
# itself is never actually tested. A release that regenerated the lock caught
# exactly this: it picked up a dependency version that does not compile, and no
# check had ever built the file that shipped. `--locked` fails loudly instead,
# which is the answer you want: an out-of-date lockfile is a change to commit,
# not something to fix silently on a runner.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # `voice-io` (cpal) needs system audio headers to compile.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # nextest runs every test binary's tests in one pool of processes, where
      # `cargo test` runs the binaries one after another. It does not run
      # doctests; the `doctests` job keeps those.
      - run: cargo nextest run --workspace --locked

  # The suite again with every feature on. `cargo test --workspace` runs the
  # default set, so a test behind `#[cfg(feature = "…")]` was compiled by the
  # `features` job and never run. Live-provider tests stay behind their own
  # environment checks and `#[ignore]`, so this job needs no credentials; the
  # Monty pool tests return early without `MONTY_BIN` (the `monty-worker` job
  # runs them for real).
  test-all-features:
    name: Test (all features)
    runs-on: ubuntu-latest
    env:
      # Debug info doubles the size of the all-features test binaries and
      # nothing here reads it.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --workspace --all-features --doc --locked

  # Doctests and the feature-specific tests, beside the suite rather than
  # after it. rustdoc compiles every doctest afresh on each run (about two
  # minutes here, nothing cached), and each feature-specific step builds the
  # crate again without default features; in the `test` job these steps
  # added four minutes after the suite had already finished.
  doctests:
    name: Doctests and feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      # `voice-io` (cpal) needs system audio headers to compile.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # nextest (the `test` job) does not run doctests.
      - run: cargo test --workspace --doc --locked
      # Run audio assertions with DSP alone: default workspace tests can hide
      # feature-gated resampler regressions or accidental voice-io coupling.
      - name: DSP streaming and audio regressions
        run: cargo test -p gemini-adk-fluent-rs --no-default-features --features dsp --lib voice::dsp --locked
      - name: SIP signaling and registration regressions
        run: cargo test -p gemini-adk-fluent-rs --no-default-features --features sip --lib telephony::sip:: --locked
      - name: OpenTelemetry SDK and tracing bridge regression
        run: cargo test -p gemini-genai-rs --no-default-features --features otel-base --lib tracing_layer_preserves_remote_parent_context --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # `--all-features`: without it every feature-gated module (sip, voice-io,
      # otel, the sqlx store, the CLI's voice path, …) is never linted, and a
      # lint that only fires behind a feature reaches main unseen.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Feature-boundary checks: a feature-heavy SDK must build at both extremes, not
  # just the default set. The `hack` job covers each feature individually.
  features:
    name: Feature extremes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      # `voice-io` (cpal) needs system audio headers to compile.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace --no-default-features --locked
      # `cargo test --workspace` uses default features, so every test file
      # behind `#![cfg(feature = "...")]` is invisible to it — a whole suite can
      # stop compiling without CI noticing, which is exactly what happened to
      # `contradiction_reconciliation`. Compile them (`--all-targets`); don't
      # run them (the model-backed ones need an API key and would cost money
      # per push). This step lived in the `test` job until it became the
      # slowest job's tail; here it shares the all-features build with the
      # extreme above.
      - run: cargo check --workspace --all-features --all-targets --locked

  # Feature isolation: every feature of every workspace member must compile on
  # its own and beside any one other feature (`--feature-powerset --depth 2`),
  # which catches a feature that needs another one it does not declare, and a
  # pair that cannot be enabled together. That is about 950 checks across the
  # workspace, so cargo-hack deals them out by `--partition M/N` over eight
  # runners; the job is as long as its slowest eighth, and rust-cache keeps
  # the dependency builds between runs.
  hack:
    name: Feature powerset ${{ matrix.partition }}/8 (cargo-hack)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      # `voice-io` (cpal) needs system audio headers to compile.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # No `--no-dev-deps`: it rewrites Cargo.toml while cargo-hack runs, which
      # changes the resolution and cannot be combined with `--locked`. Dev
      # dependencies are part of the lockfile this job should be testing.
      - run: cargo hack check --workspace --feature-powerset --depth 2 --locked --partition ${{ matrix.partition }}/8

  # rustdoc with warnings denied, every feature on. `docs.yml` builds the same
  # thing to deploy the site, but that workflow is not a dependency of `ci-ok`,
  # so a broken intra-doc link could pass the required check.
  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  # The Live frame decoder under libFuzzer for a short, fixed time per
  # target, from the committed corpus: a crash or a failed invariant in the
  # decoder (text or binary wire path) fails the job. Longer campaigns run
  # locally (`cargo +nightly fuzz run <target>` in crates/gemini-genai-rs/fuzz)
  # and their minimised corpus is committed.
  fuzz:
    name: Fuzz (Live frame decoder)
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins the stable toolchain for every other job;
      # libFuzzer needs nightly's -Z flags, so this job overrides the pin.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gemini-genai-rs/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: decode_server_message (raw bytes, text and binary paths)
        working-directory: crates/gemini-genai-rs/fuzz
        run: cargo fuzz run decode_server_message -- -max_total_time=60 -timeout=10
      - name: server_frame_structured (well-formed frames)
        working-directory: crates/gemini-genai-rs/fuzz
        run: cargo fuzz run server_frame_structured -- -max_total_time=60 -timeout=10

  # The telemetry lane's atomics under loom: every interleaving of the
  # record/stats protocol. `--cfg gemini_adk_loom` swaps in loom's model atomics for
  # that module only (see gemini-adk-rs `live/telemetry.rs`).
  loom:
    name: Loom (telemetry-lane atomics)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings --cfg gemini_adk_loom"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gemini-adk-rs --lib --release loom_ --locked

  # The benchmarks compile (they are not run: a shared runner's numbers mean
  # nothing). The fast-lane budget (`fast_lane_budget_tests`, one millisecond
  # p99 per audio frame) is asserted here in a release build, on its own,
  # rather than in the ordinary test job where every other test process
  # competes for the runner's cores.
  bench-build:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run --locked
      - run: cargo test -p gemini-adk-rs --lib --release --locked fast_lane_budget -- --ignored --test-threads=1

  # Supply chain: RustSec advisories, license allow-list, source whitelist.
  # Configuration lives in deny.toml.
  deny:
    name: Supply chain (${{ matrix.graph }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: workspace
            manifest: Cargo.toml
          - graph: python
            manifest: crates/gemini-adk-py/Cargo.toml
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # This action runs in its own container, so installing Rust on the
          # host does not select the toolchain used for dependency metadata.
          rust-version: "1.99.0"
          manifest-path: ${{ matrix.manifest }}
          arguments: --all-features --locked --config deny.toml

  # The pool tests need an actual child process. Without MONTY_BIN they return
  # early, so compilation alone cannot validate the interpreter/pool wire seam.
  monty-worker:
    name: Monty worker integration
    runs-on: ubuntu-latest
    env:
      # The worker also builds Monty's type checker. Debug symbols are not
      # needed for these assertions and can exhaust a hosted runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Build worker matching the locked pool
        run: |
          monty_runtime_version="$(python -c 'import pathlib,tomllib; lock=tomllib.loads(pathlib.Path("Cargo.lock").read_text()); print(next(p["version"] for p in lock["package"] if p["name"] == "monty-pool"))')"
          cargo install monty-runtime --version "=$monty_runtime_version" --locked --debug \
            --root "$RUNNER_TEMP/monty-runtime" --target-dir target/monty-runtime
      - name: Exercise real worker lifecycle and limits
        env:
          MONTY_BIN: ${{ runner.temp }}/monty-runtime/bin/monty
        run: cargo test -p gemini-adk-rs --lib --features code-pool code_mode::pool --locked

  # Conversation CI: compile every governed conversation spec in `conversations/`
  # and run its model-free scenario tests deterministically. Dogfoods the
  # `adk flow ci` gate on this repo's own corpus.
  conversation-ci:
    name: Conversation CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p gemini-adk-cli-rs --locked -- flow ci conversations

  # `adk spec codegen` output: a Rust, Python and Go project per gallery spec,
  # format-checked, linted, built and tested, plus a tool call through each
  # kind of generated MCP server.
  generated-projects:
    name: Generated projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install "mcp>=2.2,<3"
      - run: scripts/check-generated-projects.sh "$RUNNER_TEMP/generated"

  # The Studio front end (apps/studio): typecheck, unit tests, and a check
  # that the committed build in the web app's static tree matches the source.
  studio:
    name: Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm --prefix apps/studio ci
      - run: npm --prefix apps/studio run typecheck
      - run: npm --prefix apps/studio test
      - run: npm --prefix apps/studio run build
      - name: The committed build is up to date
        run: |
          git add -N apps/gemini-adk-web-rs/static/studio tools/gemini-adk-cli-rs/assets/web/studio
          git diff --exit-code --stat -- apps/gemini-adk-web-rs/static/studio tools/gemini-adk-cli-rs/assets/web/studio || {
            echo "::error::Studio or its CLI copy is stale: run 'npm --prefix apps/studio run build' and commit it"
            exit 1
          }

  # The Python binding is excluded from the workspace (it links libpython and
  # maturin builds it), so no job above compiles it. Build it against its own
  # lockfile and run the model-free smoke suite.
  python:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gemini-adk-py
      # The suite runs offline: a scripted model and a scripted Live server.
      # No provider key is set, so a test that reached the network would
      # fail instead of passing by accident.
      - name: Build, test, type-check
        working-directory: crates/gemini-adk-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.7,<2.0" pydantic pytest pytest-asyncio pytest-timeout mypy typing_extensions
          maturin develop --locked
          pytest -q
          python -m mypy python/gemini_adk --strict
          python -m mypy.stubtest gemini_adk._gemini_adk --ignore-disjoint-bases

  # One abi3 wheel per platform, built but not published: publishing waits
  # on the final distribution name (crates/gemini-adk-py/README.md).
  python-wheels:
    name: Python wheel (${{ matrix.name }})
    needs: [python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64
          - name: macos-arm64
            os: macos-latest
            target: aarch64
          - name: windows-x86_64
            os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/gemini-adk-py
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: ${{ startsWith(matrix.name, 'linux') && '2_28' || 'auto' }}
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: crates/gemini-adk-py/dist/*.whl
          if-no-files-found: error

  # Green only when every job above is. The one check a branch rule names:
  # with a matrix, a job's name changes when its size does, and a job that
  # is skipped would count as passed for a required check, which is why this
  # runs after a failure too (`!cancelled()`) and then fails itself.
  ci-ok:
    name: CI
    if: ${{ !cancelled() }}
    needs: [test, test-all-features, doctests, clippy, fmt, features, hack, doc, deny, fuzz, loom, bench-build, monty-worker, conversation-ci, generated-projects, studio, python, python-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
