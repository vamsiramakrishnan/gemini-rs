[workspace]
resolver = "2"
members = [
    "crates/gemini-genai-rs",
    "crates/gemini-adk-macros-rs",
    "crates/gemini-adk-rs",
    "crates/gemini-adk-fluent-rs",
    "crates/gemini-memory-rs",
    "apps/gemini-adk-server-rs",
    "apps/gemini-adk-web-rs",
    "apps/gemini-adk-api-rs",
    "examples/agents",
    "examples/quickstart",
    "examples/text-chat",
    "examples/voice-chat",
    "examples/tool-calling",
    "examples/transcription",
    "examples/cookbook",
    "examples/telephony",
    "examples/sip-agent",
    "examples/audiohook",
    "examples/voice-spec-demo",
    "tools/gemini-adk-transpiler-rs",
    "tools/gemini-adk-cli-rs",
]
exclude = [
    "evals/turnbench/predictor",
    # The Python binding crate links libpython and is built by maturin, not
    # `cargo build --workspace`; keep it out of the workspace graph/CI gates.
    "crates/gemini-adk-py",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/vamsiramakrishnan/gemini-rs"

# Internal workspace crates — version mirrors [workspace.package].version above.
# Update ONLY [workspace.package].version when releasing; release.sh handles the rest.
[workspace.dependencies]
# `default-features = false` here so that L1/L2 can own the TLS-backend choice
# (a member cannot narrow an inherited dependency's defaults, only widen them).
# Direct consumers that want L0's defaults say `default-features = true`.
gemini-genai-rs      = { path = "crates/gemini-genai-rs",      version = "1.0.0", default-features = false }
gemini-adk-macros-rs = { path = "crates/gemini-adk-macros-rs", version = "1.0.0" }
gemini-adk-rs        = { path = "crates/gemini-adk-rs",        version = "1.0.0", default-features = false }
gemini-adk-fluent-rs = { path = "crates/gemini-adk-fluent-rs", version = "1.0.0" }
gemini-memory-rs     = { path = "crates/gemini-memory-rs",     version = "1.0.0" }
gemini-adk-server-rs = { path = "apps/gemini-adk-server-rs",   version = "1.0.0" }

[workspace.lints.rust]
# Every crate but the L0 audio ring is unsafe-free and says so with
# `#![forbid(unsafe_code)]`; this keeps any new `unsafe` visible in review.
unsafe_code = "warn"
unreachable_pub = "warn"
# `missing_debug_implementations` is the next lint to turn on: 224 public
# types lack `Debug` today, most of them holding `dyn Fn` fields that need a
# hand-written impl. That is its own change, not a side effect of this one.

[workspace.lints.clippy]
# Correctness-adjacent lints that the API guidelines expect a published SDK
# to hold. Deliberate exceptions carry `#[allow(lint, reason = "…")]` at the
# site so the reason travels with the code.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
unused_self = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
doc_markdown = "warn"
